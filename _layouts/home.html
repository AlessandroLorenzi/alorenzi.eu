<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>
      {% if page.title %} {{ page.title }} | {% endif %}Alessandro Lorenzi
    </title>
    <link
      href="/media/site-screen.css"
      type="text/css"
      rel="stylesheet"
      media="screen"
    />
  </head>
  <body>
    <div class="head">
      <a href="/">Alessandro Lorenzi</a>
    </div>
    <div class="mainbody">
      <div id="content">{{ content }}</div>
      <h2>Posts</h2>
      <ul>
        {% for post in site.posts %}
        <li>
          {{post.date | date: "%-d %B %Y"}} -
          <a href="{{ post.url }}">{{ post.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
