---
on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

name: duild and deploy on AWS

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: jekyll/jekyll
    steps:
      - uses: actions/checkout@v2
        with:
          lfs: true
          submodules: recursive

      - name: Checkout LFS objects
        run: git lfs checkout

      - run: jekyll build

      - name: Deploy
        uses: reggionick/s3-deploy@v3
        with:
          folder: ./_site
          bucket: alorenzi.eu
          bucket-region: eu-south-1
          # dist-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          # invalidation: /
          delete-removed: true
          # no-cache: true
          # private: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}